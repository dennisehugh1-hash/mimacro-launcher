plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hugs.mimacrolauncher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hugs.mimacrolauncher'
        minSdk 26
        targetSdk 33
        versionCode 4
        versionName '1.3.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
